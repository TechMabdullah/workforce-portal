$kind: http-request
url: "{{baseUrl}}/api/v1/attendance"
method: POST
headers:
  Authorization: Bearer {{idToken}}
  Content-Type: application/json
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: pm.test('Status is 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 3000
