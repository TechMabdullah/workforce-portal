$kind: http-request
url: "{{baseUrl}}/api/v1/attendance"
method: POST
headers:
  Authorization: Bearer {{idToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "workerId": "{{workerId}}",
      "geoCoordinates": { "lat": 24.8607, "lng": 67.0011 },
      "locationName": "Main Site"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
