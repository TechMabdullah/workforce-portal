$kind: http-request
url: "{{baseUrl}}/api/v1/orders"
method: POST
headers:
  Authorization: Bearer {{workerOnlyToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "assignedWorkerId": "{{workerId}}",
      "title": "Test",
      "priority": "low",
      "dueDate": "2026-09-01T00:00:00Z"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
