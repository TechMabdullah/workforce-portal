$kind: http-request
url: "{{baseUrl}}/api/v1/inventory"
method: POST
headers:
  Authorization: Bearer {{idToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "sku": "SKU-001",
      "title": "Test Item",
      "quantity": 10,
      "unitPrice": 5.5
    }
scripts:
  - type: afterResponse
    code: pm.test('Status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
